<!DOCTYPE html>
<html lang="en">
<head>
  <title>Frigusoid's repo</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #1c1c1e;
      color: #e5e5e7;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }
    .header {
      display: block;
      padding: 22px 16px 18px;
      text-align: center;
      border-bottom: 1px solid #2c2c2e;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .header h1 img {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin-right: 6px;
      border-radius: 7px;
    }
    .card {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .card p {
      margin: 0 0 14px;
      color: #c7c7cc;
      font-size: 14px;
    }
    .card p b {
      color: #ffffff;
    }
    .btn {
      display: inline-block;
      background: #0a84ff;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 9px;
      text-align: center;
    }
    .btn:active {
      background: #0060df;
    }
  </style>
</head>
<body>

<div class="header">
  <h1><img src="CydiaIcon.png" alt="">Frigusoid's repo</h1>
</div>

<div class="wrap">

  <div class="card">
    <p><b>Frigusoid's repo</b> — Cydia repository.</p>
    <a class="btn" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://supermamon.github.io/Reposi3/">Add to Cydia</a>
  </div>

</div>

</body>
</html>
